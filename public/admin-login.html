<!DOCTYPE html>
<html>
<head>
  <title>ĐĂNG NHẬP ADMIN</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8b5a2b">
</head>

<body>
  <div class="main-wrapper">
  <img src="images/typo.png" alt="Title" class="login-title-img">
  <div class="container">
    <h2>ĐĂNG NHẬP ADMIN</h2>
    <p style="text-align:center; margin-top:-8px; opacity:0.8;">
      Đăng nhập bằng tài khoản Admin SV5T
    </p>
    <div class="input-group">
      <input type="text" id="adminUsername" placeholder="Username" />
    </div>
    <div class="input-group">
      <div class="input-group password-wrapper">
        <input id="adminPassword" type="password" placeholder="Mật khẩu">
        <span class="toggle-password" data-target="adminPassword" onclick="togglePassword(this)">
          <img id="passwordIcon" src="icons/eye-slash.svg" alt="toggle">
        </span>
      </div>
    </div>

    <div id="errorBox" class="error-message"></div>

    <button onclick="adminLogin()">ĐĂNG NHẬP</button>

    <br><br>
    <a class="link" href="login.html">Đăng nhập ứng viên</a>
  </div>
  </div>
  <div id="toast"></div>

  <footer class="footer">
    <strong>© 2025 Liên chi Hội khoa Hoá học,<br>
    Trường Đại học Khoa học tự nhiên, ĐHQG-HCM</strong>
  </footer>
</body>
</html>
